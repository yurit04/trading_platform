# System Configuration
# Platform-wide settings

# Database Configuration
database:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  name: ${DB_NAME:trading_platform}
  user: ${DB_USER:trader}
  password: ${DB_PASSWORD:}
  pool_size: 10
  max_overflow: 20

# TimescaleDB Configuration (for market data)
timescaledb:
  host: ${TIMESCALE_HOST:localhost}
  port: ${TIMESCALE_PORT:5432}
  name: ${TIMESCALE_DB:market_data}
  user: ${DB_USER:trader}
  password: ${DB_PASSWORD:}

# Redis Configuration
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  db: ${REDIS_DB:0}
  password: ${REDIS_PASSWORD:}
  decode_responses: true

# Logging Configuration
logging:
  level: ${LOG_LEVEL:INFO}
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: ${LOG_FILE:logs/platform.log}
  max_bytes: 10485760  # 10MB
  backup_count: 5
  console: true

# Data Storage
storage:
  historical_data_path: data/historical
  reference_data_path: data/reference
  cache_path: data/cache
  results_path: results
  
# Event Bus
event_bus:
  max_queue_size: 100000
  log_events: true
  
# Performance
performance:
  enable_profiling: false
  memory_limit_mb: 4096
