[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform"
version = "0.1.0"
description = "A comprehensive algorithmic trading platform for systematic strategies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Syntax Error Capital", email = "dev@blackhole.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core numerical / data
    "pandas",
    "numpy",
    "scikit-learn",
    "statsmodels",
    "scipy",
    "pydantic",
    "python-dateutil",
    "pyarrow",

    # Async & HTTP
    "aiohttp",
    "requests",

    # Market data
    "yfinance",
    "pandas-datareader",

    # Visualisation
    "matplotlib",
    "plotly",
    "seaborn",
    "quantstats",

    # Utilities
    "python-dotenv",
    "pyyaml",
    "click",
    "tqdm",
    "loguru",
]

[project.optional-dependencies]
# Broker / exchange connectors
brokers = [
    "ib-insync",          # Interactive Brokers (TWS/Gateway)
    # "ccxt",             # 100+ crypto exchanges
    # "alpaca-trade-api", # Alpaca
]

# Database backends (TimescaleDB / PostgreSQL + Redis)
db = [
    "sqlalchemy",
    "psycopg2-binary",
    "redis",
]

# Technical-analysis libraries
# ta-lib requires the C library: brew install ta-lib
ta = [
    "pandas-ta",
    "ta",
    "ta-lib",
]

# Machine-learning / optimisation
ml = [
    "xgboost",
    "cvxpy",
    "riskfolio-lib",
    "optuna",
]

# Jupyter notebooks
jupyter = [
    "notebook",
]

# Development tooling
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]

# Documentation
docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/yurit04/trading_platform"

[project.scripts]
trading-backtest = "scripts.backtest:main"
trading-live     = "scripts.live_trading:main"
trading-download = "scripts.data_download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"
